<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Directores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <nav class="mb-4">
        <a th:href="@{/peliculas}" class="btn btn-outline-secondary btn-sm me-2">Películas</a>
        <a th:href="@{/directores}" class="btn btn-outline-primary btn-sm">Directores</a>
    </nav>

    <h2>Lista de Directores</h2>
    <a th:href="@{/directores/formdir}" class="btn btn-primary mb-3">Nuevo Director</a>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Nacionalidad</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="d : ${directores}">
                <td th:text="${d.id}"></td>
                <td th:text="${d.nombre}"></td>
                <td th:text="${d.nacionalidad}"></td>
                <td>
                    <a th:href="@{/directores/editar/{id}(id=${d.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/directores/eliminar/{id}(id=${d.id})}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
