<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Director</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>Formulario Director</h2>

    <form th:action="@{/directores/guardar}" th:object="${directorDTO}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{nombre}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Nacionalidad</label>
            <input type="text" th:field="*{nacionalidad}" class="form-control" required />
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/directores}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
