<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Película</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>Formulario Película</h2>

    <form th:action="@{/peliculas/guardar}" th:object="${peliculaDTO}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" th:field="*{titulo}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Género</label>
            <input type="text" th:field="*{genero}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Año de Estreno</label>
            <input type="number" th:field="*{anioEstreno}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Director</label>
            <select th:field="*{directorId}" class="form-select" required>
                <option value="" disabled selected>Seleccione un director...</option>
                <option th:each="d : ${directores}" th:value="${d.id}" th:text="${d.nombre}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/peliculas}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
