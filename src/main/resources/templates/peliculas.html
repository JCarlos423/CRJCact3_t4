<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Películas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <nav class="mb-4">
        <a th:href="@{/peliculas}" class="btn btn-outline-primary btn-sm me-2">Películas</a>
        <a th:href="@{/directores}" class="btn btn-outline-secondary btn-sm">Directores</a>
    </nav>

    <h2>Lista de Películas</h2>
    <a th:href="@{/peliculas/formpeli}" class="btn btn-primary mb-3">Nueva Película</a>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>Género</th>
                <th>Año Estreno</th>
                <th>Director</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${peliculas}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.titulo}"></td>
                <td th:text="${p.genero}"></td>
                <td th:text="${p.anioEstreno}"></td>
                <td th:text="${p.nombreDirector != null ? p.nombreDirector : 'Sin Director'}"></td>
                <td>
                    <a th:href="@{/peliculas/editar/{id}(id=${p.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/peliculas/eliminar/{id}(id=${p.id})}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
